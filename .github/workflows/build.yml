name: Build Skell AdlibLab VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dsp-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore initial source bundle if needed
        run: python tools/unpack_source.py
      - name: Check project parameters and CMake contract
        run: python tests/verify_project.py
      - name: Run DSP regression smoke under ASan/UBSan
        run: |
          g++ -std=c++17 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -Itests/stubs tests/dsp_smoke.cpp -o dsp-smoke
          ./dsp-smoke

  build-windows:
    runs-on: windows-latest
    needs: dsp-safety
    steps:
      - uses: actions/checkout@v4
      - name: Restore initial source bundle if needed
        run: python tools/unpack_source.py
      - name: Configure MSVC (x64)
        run: cmake -S . -B build -A x64
      - name: Compile Windows VST3 only
        run: cmake --build build --config Release --parallel 2
      - name: Package Windows VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter 'Skell AdlibLab.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'Skell AdlibLab VST3 not found' }
          Compress-Archive -Path $plugin.FullName -DestinationPath Skell-AdlibLab-Windows-VST3.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Skell-AdlibLab-Windows-VST3
          path: Skell-AdlibLab-Windows-VST3.zip
          if-no-files-found: error
