name: Build Skell AdlibLab VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dsp-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore initial source bundle if needed
        run: python tools/unpack_source.py
      - name: Check project parameters and CMake contract
        run: python tests/verify_project.py
      - name: Check responsive UI geometry contract
        run: python tests/ui_layout.py
      - name: Run DSP regression smoke under ASan/UBSan
        run: |
          g++ -std=c++17 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -pthread -Itests/stubs tests/dsp_smoke.cpp -o dsp-smoke
          ./dsp-smoke
      - name: Verify peak-meter timing and finite input across sample rates
        run: |
          g++ -std=c++17 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -Wall -Wextra -Werror tests/peak_meter.cpp -o peak-meter
          ./peak-meter
      - name: Verify four-slot rack atomic state transitions
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pthread -fsanitize=address,undefined tests/rack_state.cpp -o rack-state
          ./rack-state
      - name: Check silent-tail denormals without host FTZ
        run: |
          g++ -std=c++17 -O2 -Itests/stubs tests/denorm_probe.cpp -o denorm-probe
          ./denorm-probe
      - name: Check real-time allocations and profile worst-case DSP CPU
        run: |
          g++ -std=c++17 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -Itests/stubs tests/realtime_alloc.cpp -o realtime-alloc
          ./realtime-alloc

  build-windows:
    runs-on: windows-latest
    needs: dsp-safety
    steps:
      - uses: actions/checkout@v5
      - name: Restore initial source bundle if needed
        run: python tools/unpack_source.py
      - name: Configure MSVC (x64)
        run: cmake -S . -B build -A x64
      - name: Compile Windows VST3 only
        run: cmake --build build --config Release --parallel 2
      - name: Stage Windows VST3 (single-extraction artifact)
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter 'Skell AdlibLab.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'Skell AdlibLab VST3 not found' }
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item -LiteralPath $plugin.FullName -Destination 'artifact/Skell AdlibLab.vst3' -Recurse -Force
          if (-not (Test-Path 'artifact/Skell AdlibLab.vst3/Contents/x86_64-win/Skell AdlibLab.vst3')) {
            throw 'x64 VST3 module missing from staged artifact'
          }
      - uses: actions/upload-artifact@v6
        with:
          name: Skell-AdlibLab-Windows-VST3
          path: artifact/
          if-no-files-found: error
