name: AdlibLab / real JUCE UI screenshots
on:
  push:
    branches: [main]
    paths: ['CMakeLists.txt', 'Source/**', 'Assets/**', 'tests/ui_renderer.cpp', '.github/workflows/ui-screenshots.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install Xvfb and Linux JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth pkg-config libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgtk-3-dev
      - name: Existing geometry regression
        run: python tests/ui_layout.py
      - name: Configure actual editor with pinned SkellCore
        run: cmake -S . -B build-renderer -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKELL_ADLIBLAB_BUILD_UI_RENDERER=ON
      - name: Build actual processor and renderer
        run: cmake --build build-renderer --target SkellAdlibLabUIRenderer --parallel 2
      - name: Capture and inspect UI pixels
        shell: bash
        run: |
          set -euo pipefail
          renderer=$(find build-renderer -type f -name SkellAdlibLabUIRenderer -executable | head -n 1)
          test -n "$renderer"
          xvfb-run -a -s '-screen 0 2560x1600x24' "$renderer" --output ui-screenshots
          test "$(find ui-screenshots -name '*.png' | wc -l)" -eq 45
      - name: Upload screenshots and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Skell-AdlibLab-Actual-JUCE-UI
          path: ui-screenshots/
          if-no-files-found: warn
          retention-days: 30
